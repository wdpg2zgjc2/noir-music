<title>NOIR MUSIC</title>
<style>
:root{--bg:#0d0c0c;--panel:#171514;--line:#2a2623;--tx:#ece6da;--mute:#8d857a;--ac:#b89a5e;--serif:"Didot","Bodoni 72",Georgia,serif;--sans:-apple-system,"SF Pro Text",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans)}
body{padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{padding:18px 20px 10px}
h1{margin:0;font:400 30px/1 var(--serif);letter-spacing:.14em}
h1 i{color:var(--ac);font-style:normal}
.bar{display:flex;gap:10px;padding:8px 20px 12px}
.bar input[type=search]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px 14px;font-size:16px;outline:0}
.bar input:focus{border-color:var(--ac)}
.imp{background:var(--ac);color:#15110a;border-radius:12px;padding:0 16px;font-weight:600}
.tabs{display:flex;gap:22px;padding:0 20px 8px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 0;color:var(--mute);border-bottom:2px solid transparent}
.tabs .on{color:var(--tx);border-color:var(--ac)}
#list{height:calc(100% - 170px - env(safe-area-inset-top));overflow-y:auto;padding:4px 0 150px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:14px;padding:10px 20px}
.row.now .t{color:var(--ac)}
.th{width:50px;height:50px;border-radius:6px;background:var(--panel) center/cover;flex:none}
.mt{flex:1;min-width:0;text-align:left}
.t{font:400 17px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;font-size:20px;color:var(--mute)}
.ic.f{color:var(--ac)}
.empty{padding:60px 36px;text-align:center;color:var(--mute);line-height:1.6}
.empty b{display:block;font:400 22px var(--serif);color:var(--tx);margin-bottom:8px}
#np{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));transition:height .3s,top .3s;display:none}
#np.show{display:block}
.mini{display:flex;align-items:center;gap:12px}
.mini .th{width:44px;height:44px}
.mini .mt{cursor:pointer}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px}
.ctl button{font-size:26px;width:48px;height:48px}
.ctl .pp{font-size:30px;background:var(--ac);color:#15110a;border-radius:50%}
.bigart{display:none;width:min(78vw,340px);aspect-ratio:1;border-radius:10px;background:var(--bg) center/cover;margin:6vh auto 24px;box-shadow:0 20px 60px #000}
.seek{width:100%;accent-color:var(--ac);margin:6px 0 0}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#np.open{top:0;padding-top:calc(env(safe-area-inset-top) + 16px);overflow-y:auto}
#np.open .bigart{display:block}
#np.open .mini{flex-direction:column;align-items:stretch;gap:2px}
#np.open .mini .th,#np.open .mini .ic{display:none}
#np.open .t{font-size:24px;text-align:center}
#np.open .s{text-align:center;font-size:15px;margin-bottom:14px}
.x{display:none;position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 8px);font-size:15px;color:var(--mute)}
#np.open .x{display:block}
.mini .ctl.m{gap:4px}
#np:not(.open) .seek,#np:not(.open) .tm,#np:not(.open) .ctl.big{display:none}
#np.open .ctl.m{display:none}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sheet div{width:100%;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));max-height:70%;overflow:auto}
.sheet h3{font:400 20px var(--serif);margin:4px 0 10px}
.sheet button{display:block;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line);font-size:16px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 20px}.hd button{color:var(--ac);padding:6px 0}
.ic{width:34px}
#ly{display:none;position:relative;height:42vh;overflow-y:auto;margin:2vh auto 12px;max-width:520px;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent)}
#ly p{margin:0;padding:8px 10px;font:400 20px/1.35 var(--serif);color:var(--mute);transition:color .3s}
#ly p.on,#ly.pl p{color:var(--tx)}#ly p.m{font:400 15px/1.5 var(--sans);padding-top:16vh}
#np.open.lyon .bigart{display:none}#np.open.lyon #ly{display:block}
.lyr{display:none;justify-content:center;gap:28px;padding:12px 0 6px}#np.open .lyr{display:flex}.lyr button{color:var(--ac);font-size:15px;padding:6px 4px}
</style>
</head>
<body>
<header><h1>NOIR<i> </i>MUSIC</h1></header>
<div class="bar"><input id="q" type="search" placeholder="Search your music"><button class="imp" id="imp">Import</button></div>
<div class="tabs"><button id="tAll" class="on">Library</button><button id="tFav">Favorites</button><button id="tPl">Playlists</button></div>
<div id="list"></div>
<input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg" multiple hidden>
<div class="sheet" id="sheet"></div>
<audio id="a" preload="auto" playsinline></audio>

<div id="np">
  <button class="x" id="close">Close</button>
  <div class="bigart" id="bigart"></div>
  <div id="ly"></div>
  <div class="mini">
    <div style="display:flex;align-items:center;gap:12px;min-width:0" id="info">
      <div class="th" id="mth"></div>
      <div class="mt" style="flex:1"><div class="t" id="nt">-</div><div class="s" id="ns"></div></div>
      <div class="ctl m"><button id="mpp">▶</button><button id="mnx">⏭</button></div>
    </div>
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0">
    <div class="tm"><span id="cu">0:00</span><span id="du">0:00</span></div>
    <div class="ctl big"><button id="pv">⏮</button><button class="pp" id="pp">▶</button><button id="nx">⏭</button></div>
  </div>
  <div class="lyr"><button id="lyBtn">Lyrics</button><button id="lyPaste">Paste lyrics</button></div>
</div>

<script>
const $=id=>document.getElementById(id),A=$('a');
let lyOn=false,lyLines=[],lyIdx=-1,lyMsg='';
let tracks=[],q='',tab='all',queue=[],cur=-1,openPl=null,PL=[];try{PL=JSON.parse(localStorage.getItem('noir_pl')||'[]')}catch(e){}
const savePL=()=>{try{localStorage.setItem('noir_pl',JSON.stringify(PL))}catch(e){}};const thumbs={};
const db=new Promise((ok,no)=>{const r=indexedDB.open('noir',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('t',m);const r=f(t.objectStore('t'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
const art=t=>t.art?(thumbs[t.id]??=URL.createObjectURL(t.art)):'';
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function txt(d){const e=d[0];let b=d.subarray(1),l=['windows-1252','utf-16le','utf-16be','utf-8'][e]||'utf-8';
  if(e===1||e===2){if(b[0]===0xFE&&b[1]===0xFF){l='utf-16be';b=b.subarray(2)}else if(b[0]===0xFF&&b[1]===0xFE){l='utf-16le';b=b.subarray(2)}}
  if(e===0)try{return new TextDecoder('utf-8',{fatal:true}).decode(b).replace(/\0+$/,'').trim()}catch(x){}
  return new TextDecoder(l).decode(b).replace(/\0+$/,'').trim()}
const ok=x=>x&&!/[\uFFFD\uFFFE\uFFFF\u0000-\u0008]/.test(x);
async function tags(f){
  const u=new Uint8Array(await f.slice(0,6e6).arrayBuffer()),t={};
  if(String.fromCharCode(u[0],u[1],u[2])!=='ID3'||u[3]<3)return t;
  const sy=(a)=>((u[a]&127)<<21)|((u[a+1]&127)<<14)|((u[a+2]&127)<<7)|(u[a+3]&127);
  const end=Math.min(10+sy(6),u.length);let p=10;
  while(p+10<end){
    const id=String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const sz=u[3]===4?sy(p+4):((u[p+4]<<24)|(u[p+5]<<16)|(u[p+6]<<8)|u[p+7])>>>0;
    const d=u.subarray(p+10,p+10+sz);p+=10+sz;
    if(id==='TIT2')t.title=txt(d);else if(id==='TPE1')t.artist=txt(d);else if(id==='TALB')t.album=txt(d);
    else if(id==='APIC'&&!t.art){
      const e=d[0];let i=1;while(i<d.length&&d[i])i++;const mime=new TextDecoder().decode(d.subarray(1,i));i+=2;
      if(e===0||e===3){while(i<d.length&&d[i])i++;i++}else{while(i<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}
      t.art=new Blob([d.slice(i)],{type:mime.includes('/')?mime:'image/jpeg'});
    }
  }
  return t;
}

async function load(){tracks=await tx('readonly',s=>s.getAll());tracks.sort((a,b)=>a.title.localeCompare(b.title));draw()}
function shown(){const k=q.toLowerCase();let b=tracks;
  if(tab==='pl'&&openPl){const p=PL.find(x=>x.id===openPl);b=p?p.ids.map(i=>tracks.find(t=>t.id===i)).filter(Boolean):[]}
  return b.filter(t=>(tab!=='fav'||t.fav)&&(!k||(t.title+' '+t.artist+' '+(t.album||'')).toLowerCase().includes(k)))}
function draw(){
  const el=$('list');
  if(tab==='pl'&&!openPl){
    el.innerHTML='<div class="hd"><span></span><button data-n>New playlist</button></div>'+(PL.length?PL.map(p=>`<div class="row" data-pl="${p.id}"><div class="th"></div><button class="mt" data-o><div class="t">${esc(p.name)}</div><div class="s">${p.ids.length} song${p.ids.length==1?'':'s'}</div></button><button class="ic" data-x>✕</button></div>`).join(''):'<div class="empty"><b>No playlists yet</b>Tap New playlist, or use ＋ on any song to add it to one.</div>');return}
  const L=shown(),pl=tab==='pl'&&PL.find(x=>x.id===openPl);
  const head=pl?`<div class="hd"><button data-b>‹ Playlists</button><button data-pa>Play all</button></div><div style="padding:0 20px 6px;font:400 22px var(--serif)">${esc(pl.name)}</div>`:'';
  if(!tracks.length){el.innerHTML='<div class="empty"><b>Your library is empty</b>Tap Import and choose audio files from the Files app. They stay on this phone and play offline.</div>';return}
  if(!L.length){el.innerHTML=head+'<div class="empty"><b>Nothing here</b>'+(pl?'Add songs with the ＋ button on any song in your Library.':tab==='fav'?'Tap the heart on a song to add it to Favorites.':'No songs match your search.')+'</div>';return}
  const now=queue[cur]?.id;
  el.innerHTML=head+L.map(t=>`<div class="row${t.id===now?' now':''}" data-id="${t.id}"><div class="th" style="${art(t)?`background-image:url(${art(t)})`:''}"></div><button class="mt" data-p><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}${t.album?' · '+esc(t.album):''}</div></button><button class="ic${t.fav?' f':''}" data-f>${t.fav?'♥':'♡'}</button><button class="ic" data-a>＋</button><button class="ic" data-${pl?'r':'d'}>✕</button></div>`).join('');
}
function newPl(cb){const n=(prompt('Playlist name')||'').trim();if(!n)return;const p={id:Date.now(),name:n,ids:[]};PL.push(p);savePL();cb?cb(p):draw()}
function addTo(tid){
  const sh=$('sheet'),close=()=>sh.classList.remove('on');
  sh.innerHTML=`<div><h3>Add to playlist</h3>${PL.map(p=>`<button data-s="${p.id}">${esc(p.name)}</button>`).join('')}<button data-s="new">New playlist…</button><button data-s="x" style="color:var(--mute)">Cancel</button></div>`;
  sh.classList.add('on');
  sh.onclick=e=>{const b=e.target.closest('[data-s]');if(!b){if(e.target===sh)close();return}
    const v=b.dataset.s;close();if(v==='x')return;
    const put=p=>{if(!p.ids.includes(tid))p.ids.push(tid);savePL();draw()};
    if(v==='new')newPl(put);else put(PL.find(x=>x.id===+v))};
}
$('list').onclick=async e=>{
  const g=s=>e.target.closest(s);
  if(g('[data-n]'))return newPl();
  if(g('[data-b]')){openPl=null;return draw()}
  if(g('[data-pa]')){queue=shown();return play(0)}
  const pr=g('[data-pl]');
  if(pr){const id=+pr.dataset.pl;if(g('[data-x]')){const p=PL.find(x=>x.id===id);if(confirm('Delete playlist "'+p.name+'"? Songs stay in your library.')){PL=PL.filter(x=>x.id!==id);savePL();draw()}}else{openPl=id;draw()}return}
  const r=g('.row');if(!r)return;const id=+r.dataset.id,t=tracks.find(x=>x.id===id);
  if(g('[data-f]')){t.fav=t.fav?0:1;await tx('readwrite',s=>s.put(t));draw()}
  else if(g('[data-a]'))addTo(id);
  else if(g('[data-r]')){const p=PL.find(x=>x.id===openPl);p.ids=p.ids.filter(i=>i!==id);savePL();draw()}
  else if(g('[data-d]')){if(confirm('Remove "'+t.title+'" from NOIR MUSIC?')){await tx('readwrite',s=>s.delete(id));PL.forEach(p=>p.ids=p.ids.filter(i=>i!==id));savePL();if(queue[cur]?.id===id){A.pause();A.removeAttribute('src');$('np').classList.remove('show')}await load()}}
  else{queue=shown();play(queue.findIndex(x=>x.id===id))}
};
function play(i){
  if(!queue.length)return;cur=(i+queue.length)%queue.length;const t=queue[cur];
  if(A.dataset.id!=t.id){if(A.src)URL.revokeObjectURL(A.src);A.src=URL.createObjectURL(t.blob);A.dataset.id=t.id}
  A.play().catch(()=>{});
  $('np').classList.add('show');$('nt').textContent=t.title;$('ns').textContent=t.artist;
  const u=art(t);$('mth').style.backgroundImage=u?`url(${u})`:'';$('bigart').style.backgroundImage=u?`url(${u})`:'';
  if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'',artwork:u?[{src:u,sizes:'512x512',type:t.art.type}]:[]});
  lyMsg='';renderLy();getLy(t);draw();
}

function renderLy(){
  const t=queue[cur],el=$('ly');lyLines=[];lyIdx=-1;
  if(!t){el.innerHTML='';return}
  const L=t.lyrics;
  if(!L){el.className='';el.innerHTML='<p class="m">'+esc(lyMsg||(t.lyTried?'No lyrics found. Tap Paste lyrics to add your own.':''))+'</p>';return}
  const timed=[];
  for(const ln of L.split('\n')){const m=ln.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)(.*)$/);if(m)for(const x of m[1].matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g))timed.push({t:+x[1]*60+ +x[2],s:m[2].trim()})}
  if(timed.length>2){timed.sort((a,b)=>a.t-b.t);lyLines=timed}
  el.className=lyLines.length?'':'pl';
  el.innerHTML=(lyLines.length?lyLines.map(x=>x.s||'♪'):L.split('\n')).map(x=>'<p>'+(esc(x)||'&nbsp;')+'</p>').join('');
}
function syncLy(){
  if(!lyOn||!lyLines.length)return;
  const c=A.currentTime+.25;let i=-1;for(let k=0;k<lyLines.length&&lyLines[k].t<=c;k++)i=k;
  if(i===lyIdx)return;const el=$('ly'),ps=el.children;ps[lyIdx]?.classList.remove('on');lyIdx=i;const p=ps[i];
  if(p){p.classList.add('on');el.scrollTo({top:p.offsetTop-el.clientHeight/2+p.clientHeight/2,behavior:'smooth'})}
}
async function getLy(t){
  if(t.lyrics||t.lyTried)return;
  if(!navigator.onLine){lyMsg='Connect to the internet to look up lyrics, or tap Paste lyrics.';renderLy();return}
  lyMsg='Searching for lyrics…';renderLy();
  try{
    const p=new URLSearchParams({track_name:t.title});if(t.artist&&t.artist!=='Unknown artist')p.set('artist_name',t.artist);
    const r=await fetch('https://lrclib.net/api/search?'+p);if(!r.ok)throw 0;
    const a=await r.json(),m=a.find(x=>x.syncedLyrics)||a.find(x=>x.plainLyrics);
    const f=tracks.find(x=>x.id===t.id)||t;f.lyrics=m?(m.syncedLyrics||m.plainLyrics):'';f.lyTried=1;t.lyrics=f.lyrics;t.lyTried=1;
    await tx('readwrite',s=>s.put(f));lyMsg='';
  }catch(e){lyMsg='Could not reach the lyrics service. You can tap Paste lyrics instead.'}
  if(queue[cur]?.id===t.id)renderLy();
}
$('lyBtn').onclick=()=>{lyOn=!lyOn;$('np').classList.toggle('lyon',lyOn);$('lyBtn').textContent=lyOn?'Artwork':'Lyrics';lyIdx=-1;syncLy()};
$('lyPaste').onclick=()=>{
  const t=queue[cur];if(!t)return;const sh=$('sheet'),close=()=>sh.classList.remove('on');
  sh.innerHTML='<div><h3>Lyrics</h3><textarea id="lyTa" style="width:100%;height:38vh;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:var(--sans)"></textarea><button data-s="save">Save</button><button data-s="x" style="color:var(--mute)">Cancel</button></div>';
  $('lyTa').value=t.lyrics||'';sh.classList.add('on');
  sh.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b){if(e.target===sh)close();return}
    if(b.dataset.s==='save'){const f=tracks.find(x=>x.id===t.id)||t,v=$('lyTa').value.trim();f.lyrics=v;f.lyTried=1;t.lyrics=v;t.lyTried=1;await tx('readwrite',s=>s.put(f));renderLy()}
    close()};
};
const toggle=()=>A.paused?A.play():A.pause();
['pp','mpp'].forEach(i=>$(i).onclick=e=>{e.stopPropagation();toggle()});
['nx','mnx'].forEach(i=>$(i).onclick=e=>{e.stopPropagation();play(cur+1)});
$('pv').onclick=()=>A.currentTime>3?A.currentTime=0:play(cur-1);
A.onplay=A.onpause=()=>{const p=A.paused?'▶':'❚❚';$('pp').textContent=p;$('mpp').textContent=p;if('mediaSession'in navigator)navigator.mediaSession.playbackState=A.paused?'paused':'playing'};
A.onended=()=>play(cur+1);
A.ontimeupdate=()=>{syncLy();
  if(A.duration){$('seek').value=A.currentTime/A.duration*1000;$('cu').textContent=fmt(A.currentTime);$('du').textContent=fmt(A.duration);
    if('mediaSession'in navigator&&navigator.mediaSession.setPositionState)try{navigator.mediaSession.setPositionState({duration:A.duration,position:A.currentTime,playbackRate:1})}catch(e){}}
};
$('seek').oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration};
$('info').onclick=()=>$('np').classList.add('open');
$('close').onclick=()=>$('np').classList.remove('open');
if('mediaSession'in navigator){const m=navigator.mediaSession;
  m.setActionHandler('play',async()=>{m.playbackState='playing';try{await A.play()}catch(x){const t=A.currentTime;A.addEventListener('loadedmetadata',()=>{A.currentTime=t;A.play().catch(()=>{})},{once:true});A.load()}});
  m.setActionHandler('pause',()=>{A.pause();m.playbackState='paused'});
  m.setActionHandler('previoustrack',()=>play(cur-1));m.setActionHandler('nexttrack',()=>play(cur+1));
  m.setActionHandler('seekto',d=>{A.currentTime=d.seekTime});
  m.setActionHandler('seekbackward',()=>A.currentTime-=10);m.setActionHandler('seekforward',()=>A.currentTime+=10)}
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const fs=[...e.target.files];let n=0;$('imp').textContent='0/'+fs.length;
  for(const f of fs){
    let t={};try{t=await tags(f)}catch(x){}
    await tx('readwrite',s=>s.put({title:ok(t.title)?t.title:f.name.replace(/\.[^.]+$/,''),artist:ok(t.artist)?t.artist:'Unknown artist',album:ok(t.album)?t.album:'',art:t.art||null,fav:0,blob:new Blob([f],{type:f.type||'audio/mpeg'})}));
    $('imp').textContent=(++n)+'/'+fs.length;
  }
  $('imp').textContent='Import';e.target.value='';await load();
};
$('q').oninput=e=>{q=e.target.value;draw()};
const T={all:'tAll',fav:'tFav',pl:'tPl'};const setTab=t=>{tab=t;openPl=null;for(const k in T)$(T[k]).className=k===t?'on':'';draw()};
$('tAll').onclick=()=>setTab('all');$('tFav').onclick=()=>setTab('fav');$('tPl').onclick=()=>setTab('pl');
navigator.storage?.persist?.();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
